[project]
name = "question-analyzer-api"
version = "0.1.0"
description = "FastAPI service that analyzes Arabic multiple-choice questions for clarity, completeness, and answer validity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.59.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E501"]
